<!doctype html><html><body style="margin:0;background:#000">
<div id="w" style="position:relative;width:1206px;height:2622px;overflow:hidden">
<canvas id="g" width="50" height="50" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
<canvas id="p" width="1206" height="2622" style="position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.5"></canvas>
</div>
<script>
// Градиент — алгоритм Telegram Web (ChatBackgroundGradientRenderer), фаза 0, дневная тема по умолчанию
const colors=['#dbddbb','#6ba587','#d5d88d','#88b884'].map(h=>({r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}));
const P=[{x:.8,y:.1},{x:.6,y:.2},{x:.35,y:.25},{x:.25,y:.6},{x:.2,y:.9},{x:.4,y:.8},{x:.65,y:.75},{x:.75,y:.4}];
const pos=k=>{const t=[];for(let n=0;n<4;n++){t[n]={...P[(k+n*2)%P.length]};t[n].y=1-t[n].y}return t};
const g=document.getElementById('g'),gc=g.getContext('2d'),W=50,H=50,img=gc.createImageData(W,H),d=img.data,c=pos(0);let l=0;
for(let y=0;y<H;y++){const t=y/H-.5,r2=t*t;for(let x=0;x<W;x++){const o=x/W-.5,u=.35*Math.sqrt(o*o+r2),dd=u*u*.8*8,f=Math.sin(dd),p=Math.cos(dd),
 m=Math.max(0,Math.min(1,.5+o*p-t*f)),h=Math.max(0,Math.min(1,.5+o*f+t*p));let s=0,R=0,G=0,B=0;
 for(let e=0;e<4;e++){const i=m-c[e].x,a=h-c[e].y;let w=Math.max(0,.9-Math.sqrt(i*i+a*a));w=w*w*w*w;s+=w;R+=w*colors[e].r;G+=w*colors[e].g;B+=w*colors[e].b}
 d[l++]=R/s;d[l++]=G/s;d[l++]=B/s;d[l++]=255}}
gc.putImageData(img,0,0);
// Узор: высота плитки = (500 + высота окна/2.5) pt, как в Telegram Web; экран 874 pt, масштаб 3x
const im=new Image();im.onload=()=>{const p=document.getElementById('p').getContext('2d');const n=1206,r=2622;
 const o=(500+874/2.5)*3, a=im.width*o/im.height;const row=y=>{for(let x=0;x<n;x+=a)p.drawImage(im,x,y,a,o)};
 let u=(r-o)/2;row(u);if(u>0){let e=u;do row(e-=o);while(e>=0)}for(let e=u+o;e<r-1;e+=o)row(e);document.title='ready'};
im.src='tg/pattern.svg';
</script></body></html>
